<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flock · How’s life with your flatmates?</title>
<meta name="description" content="A 1-minute, anonymous survey about living with flatmates in Rome and Milan. In English and Italian.">
<meta property="og:title" content="How’s life with your flatmates?">
<meta property="og:description" content="5 questions, 1 minute, anonymous, in English or Italian. Help shape Flock, the app for shared flats.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14162B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="flock-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking, so a slow font server can't hold up the survey -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
<script>
  // Last resort: if the survey can't start, offer a clean restart, never a blank page.
  function flockRescue() {
    var app = document.getElementById('app');
    if (!app || app.querySelector('.screen') || app.querySelector('#rescue')) return;
    app.innerHTML = '<div id="rescue" style="padding:32px 24px;font-family:system-ui,sans-serif;line-height:1.5">' +
      '<p>Something went wrong loading the survey.<br>Il sondaggio non si è caricato correttamente.</p>' +
      '<button style="margin-top:16px;padding:12px 20px;font:inherit">Try again / Riprova</button></div>';
    app.querySelector('button').onclick = function () {
      try { localStorage.clear(); } catch (e) {}
      location.reload();
    };
  }
  addEventListener('error', function () { setTimeout(flockRescue, 300); });
</script>
<script type="module" src="app.js" onerror="flockRescue()"></script>
</head>
<body>
<div id="app" class="app"></div>
<noscript><p style="padding:24px;font-family:system-ui">This survey needs JavaScript. / Questo sondaggio richiede JavaScript.</p></noscript>
</body>
</html>
